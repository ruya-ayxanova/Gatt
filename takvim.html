<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تورک تقویمی و اذانی</title>
<style>
:root{--bg:#e9eeea;--card:#f7f9f6;--ink:#17302b;--mute:#5d7570;--acc:#b8821f;--line:#cfd9d3;--sel:#17302b;--selt:#f7f9f6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1d1b;--card:#172a27;--ink:#e4eee9;--mute:#8fa8a2;--acc:#e0b04f;--line:#2a423e;--sel:#e0b04f;--selt:#0f1d1b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);max-width:520px;margin:0 auto}
header{padding:20px 4px 12px}
.next{font:600 15px Georgia,serif;color:var(--mute)}
.big{font:400 52px/1.1 Georgia,serif;letter-spacing:-1px}
.left{color:var(--acc);font-weight:600}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:16px 4px 22px}
.tick{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.5}
.now{position:absolute;top:-6px;width:12px;height:18px;margin-left:-6px;background:var(--acc);border-radius:6px}
.loc{display:flex;gap:8px;margin-bottom:14px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
select{flex:1;min-width:0}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button.p{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.nav b{font:600 20px Georgia,serif}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g .h{font-size:12px;line-height:1.2;color:var(--mute);padding:6px 0}
.d{aspect-ratio:1;border:0;border-radius:10px;background:transparent;padding:0;position:relative;font-size:16px}
.d.t{outline:2px solid var(--acc)}
.d.s{background:var(--sel);color:var(--selt)}
.d.n::after{content:"";position:absolute;bottom:6px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:3px;background:var(--acc)}
.panel{background:var(--card);border-radius:16px;padding:16px;margin:16px 0 28px}
.panel h2{margin:0 0 10px;font:600 18px Georgia,serif}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border:0}
.row.cur{color:var(--acc);font-weight:700}
textarea{width:100%;min-height:80px;margin-top:10px;resize:vertical}
.small{font-size:13px;color:var(--mute);margin-top:8px}
.ed{display:none;background:var(--card);border-radius:16px;padding:16px;margin:0 0 28px}.ed.o{display:block}.ed input,.ed select{width:100%;margin:3px 0}.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.ed h3{margin:12px 0 4px;font:600 16px Georgia,serif}.custom{display:none;gap:8px;margin-bottom:14px}
.custom input{flex:1;min-width:0}
</style>
</head>
<body>
<header>
  <div class="next" id="nextName"></div>
  <div class="big" id="nextTime"></div>
  <div class="left" id="left"></div>
  <div class="bar" id="bar"></div>
</header>

<div class="loc">
  <select id="city"></select>
  <button id="gps">Konumum</button>
</div>
<div class="custom" id="custom">
  <input id="lat" inputmode="decimal" placeholder="Enlem (41.01)">
  <input id="lng" inputmode="decimal" placeholder="Boylam (28.98)">
  <button class="p" id="setll">Kaydet</button>
</div>

<select id="cal" style="width:100%;margin-bottom:8px"><option value="g">Miladi takvim</option><option value="j">Hicri Şemsî takvim</option></select>
<div class="nav">
  <button id="prev" aria-label="Önceki ay">‹</button>
  <b id="month"></b>
  <button id="nextm" aria-label="Sonraki ay">›</button>
</div>
<div class="g" id="grid"></div>

<section class="panel">
  <h2 id="dayTitle"></h2>
  <div id="times"></div>
  <textarea id="note" placeholder="Bu güne not ekle"></textarea>
  <div class="small">Vakitler Tahran Üniversitesi yöntemiyle (sabah 17,7°, akşam 4,5°, yatsı 14°) konumdan hesaplanır, internet gerekmez. Şer'î gece yarısı, gün batımı ile ertesi sabah ezanı arasının ortasıdır.</div>
</section>

<button id="edbtn" style="width:100%;margin-bottom:14px">Ay ve gün adlarını düzenle</button>
<section class="ed" id="ed">
  <h3>Ay adları</h3><div class="two" id="edm"></div>
  <h3>Gün adları</h3><div class="two" id="edd"></div>
  <h3>Vakit adları</h3><div class="two" id="edp"></div>
  <h3>Haftanın ilk günü</h3><select id="ws"></select>
  <button id="edreset" style="margin-top:12px">Varsayılana dön</button>
</section>

function jalCal(jy){

function g2d(gy,gm,gd){

function d2g(jdn){

function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}

  const gy=d2g(jdn)[0]; let jy=gy-621; const r=jalCal(jy); let k=jdn-g2d(gy,3,r.march);

let today=new Date(), sel=new Date(today), view=new Date(today.getFullYear(),today.getMonth(),1), vj=toJ(today).slice(0,2);

function calc(date,lat,lng){
  const tz=-new Date(date.getFullYear(),date.getMonth(),date.getDate(),12).getTimezoneOffset()/60;
  const d=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)/864e5+2440587.5-2451545;
  const g=fix(357.529+.98560028*d,360), q=fix(280.459+.98564736*d,360);
  const L=fix(q+1.915*Math.sin(g*R)+.02*Math.sin(2*g*R),360), e=23.439-3.6e-7*d;
  const ra=fix(Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15,24);

const fmt=h=>{if(isNaN(h))return '--:--';let m=Math.round(fix(h,24)*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

function header(){
  const now=new Date(), h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  const tm=calc(now,S.lat,S.lng);
  let i=tm.findIndex(x=>x>h), target, nm;
  if(i<0){const tt=calc(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1),S.lat,S.lng);target=tt[0]+24;nm=S.pn[0]}
  else{target=tm[i];nm=S.pn[i]}
  $('nextName').innerHTML='<bdi>'+esc(nm)+'</bdi>';
  $('nextTime').textContent=fmt(target);
  const m=Math.max(0,Math.round((target-h)*60));
  $('left').textContent=(m>=60?Math.floor(m/60)+' sa ':'')+m%60+' dk kaldı';
  $('bar').innerHTML=tm.map(x=>'<span class="tick" style="left:'+(fix(x,24)/24*100)+'%"></span>').join('')+'<span class="now" style="left:'+(h/24*100)+'%"></span>';
}

const isJ=()=>S.cal==='j', WS=()=>isJ()?S.wsj:S.ws, MN=()=>isJ()?S.mj:S.m;
function monthInfo(){
  if(isJ()){
    const [jy,jm]=vj, len=jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29), j0=j2d(jy,jm,1);
    return {title:'<bdi>'+esc(S.mj[jm-1])+'</bdi> '+jy,days:Array.from({length:len},(_,i)=>{const g=d2g(j0+i);return {date:new Date(g[0],g[1]-1,g[2]),label:i+1}})};
  }
  const y=view.getFullYear(),m=view.getMonth(),n=new Date(y,m+1,0).getDate();
  return {title:'<bdi>'+esc(S.m[m])+'</bdi> '+y,days:Array.from({length:n},(_,i)=>({date:new Date(y,m,i+1),label:i+1}))};
}
function render(){
  const mi=monthInfo(), w=WS();
  $('month').innerHTML=mi.title;
  const first=((mi.days[0].date.getDay()+6)%7-w+7)%7;
  let html=[0,1,2,3,4,5,6].map(i=>'<div class="h">'+S.d[(w+i)%7]+'</div>').join('')+'<div></div>'.repeat(first);
  mi.days.forEach(o=>{const k=key(o.date);
    html+='<button class="d'+(k===key(today)?' t':'')+(k===key(sel)?' s':'')+(S.notes[k]?' n':'')+'" data-t="'+o.date.getTime()+'">'+o.label+'</button>'});
  $('grid').innerHTML=html;
  if(isJ()){const j=toJ(sel);$('dayTitle').innerHTML=j[2]+' <bdi>'+esc(S.mj[j[1]-1])+'</bdi> '+j[0]+', '+esc(S.city)}
  else $('dayTitle').innerHTML=sel.getDate()+' <bdi>'+esc(S.m[sel.getMonth()])+'</bdi> '+sel.getFullYear()+', '+esc(S.city);
  const tm=calc(sel,S.lat,S.lng), isT=key(sel)===key(today), nh=today.getHours()+today.getMinutes()/60;
  const cur=isT?tm.findIndex(x=>x>nh):-1;
  $('times').innerHTML=tm.map((x,i)=>'<div class="row'+(i===cur?' cur':'')+'"><span><bdi>'+esc(S.pn[i])+'</bdi></span><span>'+fmt(x)+'</span></div>').join('');
  $('note').value=S.notes[key(sel)]||'';
}

$('grid').onclick=e=>{const b=e.target.closest('.d');if(!b)return;sel=new Date(+b.dataset.t);render()};
function step(n){
  if(isJ()){let y=vj[0],m=vj[1]+n;if(m<1){m=12;y--}if(m>12){m=1;y++}vj=[y,m]}
  else view=new Date(view.getFullYear(),view.getMonth()+n,1);
  render();
}
$('prev').onclick=()=>step(-1);
$('nextm').onclick=()=>step(1);
$('note').oninput=e=>{const k=key(sel);if(e.target.value.trim())S.notes[k]=e.target.value;else delete S.notes[k];save();
  const b=document.querySelector('.d.s');if(b)b.classList.toggle('n',!!S.notes[k])};

const opts='<option>Bölgem</option>'+Object.keys(G).map(g=>'<optgroup label="'+g+'">'+G[g].map(c=>'<option>'+c+'</option>').join('')+'</optgroup>').join('')+'<option value="_c">Koordinat gir…</option>';
$('city').innerHTML=opts;
$('city').value=CITIES[S.city]?S.city:'_c';
$('custom').style.display=$('city').value==='_c'?'flex':'none';
$('city').onchange=e=>{
  if(e.target.value==='_c'){$('custom').style.display='flex';return}
  $('custom').style.display='none';
  S.city=e.target.value;[S.lat,S.lng]=CITIES[S.city];save();header();render();
};
$('setll').onclick=()=>{
  const a=parseFloat($('lat').value.replace(',','.')), o=parseFloat($('lng').value.replace(',','.'));
  if(isNaN(a)||isNaN(o)||Math.abs(a)>66||Math.abs(o)>180){alert('Enlem −66 ile 66, boylam −180 ile 180 arasında olmalı.');return}
  S.city='Özel konum';S.lat=a;S.lng=o;save();header();render();
};
$('gps').onclick=()=>{
  if(!navigator.geolocation){alert('Bu cihaz konumu desteklemiyor.');return}
  navigator.geolocation.getCurrentPosition(p=>{
    S.city='Konumum';S.lat=p.coords.latitude;S.lng=p.coords.longitude;save();
    if(![...$('city').options].some(o=>o.value==='Konumum'))$('city').insertAdjacentHTML('afterbegin','<option>Konumum</option>');
    $('city').value='Konumum';$('custom').style.display='none';header();render();
  },()=>alert('Konum alınamadı. Konum iznini açın veya listeden şehir seçin.'),{timeout:15000});
};
if(S.city==='Konumum'||S.city==='Özel konum'){$('city').insertAdjacentHTML('afterbegin','<option>'+S.city+'</option>');$('city').value=S.city}
const esc=t=>t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function buildEd(){
  $('edm').innerHTML=MN().map((x,i)=>'<input dir="auto" data-m="'+i+'" value="'+esc(x)+'">').join('');
  $('edd').innerHTML=S.d.map((x,i)=>'<input dir="auto" data-w="'+i+'" value="'+esc(x)+'">').join('');
  $('edp').innerHTML=S.pn.map((x,i)=>'<input dir="auto" data-p="'+i+'" value="'+esc(x)+'">').join('');
  $('ws').innerHTML=S.d.map((x,i)=>'<option value="'+i+'">'+esc(x)+'</option>').join('');
  $('ws').value=WS();
}
$('edbtn').onclick=()=>{buildEd();$('ed').classList.toggle('o')};
$('ed').oninput=e=>{const t=e.target;
  if(t.dataset.m!==undefined)MN()[+t.dataset.m]=t.value;
  else if(t.dataset.w!==undefined)S.d[+t.dataset.w]=t.value;
  else if(t.dataset.p!==undefined){S.pn[+t.dataset.p]=t.value;header()}
  else return;
  save();render()};
$('ws').onchange=e=>{if(isJ())S.wsj=+e.target.value;else S.ws=+e.target.value;save();render()};
$('edreset').onclick=()=>{S.m=DM.slice();S.mj=DMJ.slice();S.d=DD.slice();S.pn=DPN.slice();S.ws=5;S.wsj=5;save();buildEd();render()};
$('cal').value=S.cal;
$('cal').onchange=e=>{S.cal=e.target.value;vj=toJ(sel).slice(0,2);view=new Date(sel.getFullYear(),sel.getMonth(),1);save();buildEd();render()};
header();render();setInterval(header,30000);
</script>
</body>
</html>
